# LOCAL DEVELOPMENT ONLY. Production runs on FastAPI Cloud, see deploy.sh.
#
# Local stack (BuildKit on — Docker Desktop default; else: set DOCKER_BUILDKIT=1):
#   docker compose --env-file ./backend/app/.env up -d --build backend
#
# Each start runs: db -> migrate -> seed -> backend. Migrations and the seed only apply
# what's missing, so repeating them is safe. If either fails, the backend doesn't start.
#
# Local with Docker frontend (optional):
#   docker compose --env-file ./backend/app/.env --profile local up -d

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile
    cache_from:
      - chatbot-backend:local
  image: chatbot-backend:local
  pull_policy: never

x-backend-env: &backend-env
  env_file:
    - ./backend/app/.env
  environment:
    POSTGRESQL_SERVER: db
    POSTGRESQL_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    VECTOR_STORE_PROVIDER: pinecone
    ENVIRONMENT: local
    DOMAIN: localhost:8000

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?Set POSTGRESQL_PASSWORD via --env-file}
      POSTGRES_DB: ${POSTGRESQL_DATABASE:-chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: [*backend-image, *backend-env]
    working_dir: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    <<: [*backend-image, *backend-env]
    working_dir: /app
    command: ["python", "seed.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: [*backend-image, *backend-env]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  frontend:
    profiles: [local]
    build:
      context: ./frontend/Chatbot
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
